<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Pallavi Maralla Satish</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #080c18;
        color: #f0f4f8;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      .container { max-width: 480px; }

      .code {
        font-family: 'Fira Code', monospace;
        font-size: 0.85rem;
        color: #40d9f5;
        margin-bottom: 1.5rem;
        letter-spacing: 0.05em;
      }

      h1 {
        font-size: 6rem;
        font-weight: 700;
        background: linear-gradient(135deg, #40d9f5, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }

      p {
        color: #8899b0;
        font-size: 1rem;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        background: transparent;
        border: 1px solid #40d9f5;
        color: #40d9f5;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.2s, box-shadow 0.2s;
      }

      a:hover {
        background: rgba(64, 217, 245, 0.08);
        box-shadow: 0 0 16px rgba(64, 217, 245, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">// error: route_not_found</div>
      <h1>404</h1>
      <p>Looks like this page doesn't exist.<br />Let's get you back on track.</p>
      <a href="/">&#8592; Back to Portfolio</a>
    </div>
  </body>
</html>
